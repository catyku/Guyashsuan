<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('GUYAHSUAN Law Office | 業務領域')}"></head>
<body>
    <div id="preloader"></div>

    <div class="main-wrapper">
        <header th:replace="~{fragments/layout :: headerInner}"></header>

        <!-- PAGE TITLE
        ================================================== -->
        <section class="top-position1 pt-0">
            <div class="page-title-section bg-img cover-background secondary-overlay" data-overlay-dark="8" data-background="/img/bg/bg-04.jpg">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="page-title">
                                <h1>Guyahsuan  Law Office</h1>
                                <p class="text-white fs-4 mb-0 letter-spacing-2" style="letter-spacing:7px;">/黃煦詮律師　鄭文朋律師 　陳庭浩律師</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COUNTER
            ================================================== -->
            <section class="bg-img cover-background secondary-overlay" data-overlay-dark="8" data-background="/img/service_bg.jpg">
                <div class="container">
                    <div class="row mt-n1-9">
                        <div class="col-sm-6 col-lg-3 mt-1-9">
                        </div>
                    </div>
                </div>
            </section>

            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="breadcrumb">
                            <ul>
                                <li><a th:href="@{/}">Home</a></li>
                                <li><a th:href="@{/service.html}">Business Areas</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ABOUTUS / SERVICES
        ================================================== -->
        <section class="about-style3" style="padding-bottom:200px;padding-top: 0px;">
            <div class="container">
                <div class="section-heading" style="padding-bottom:60px;">
                    <span class="alt-font" style="letter-spacing:10px;">業務領域</span>
                    <h2>Business  Areas</h2>
                </div>
                <div class="row align-items-center mt-n2-6">
                    <div class="col-lg-6 order-2 order-lg-1 mt-2-6">
                        <div class="row mt-n1-9">
                            <div class="col-sm-6 mt-1-9" th:each="svc : ${services}">
                                <div class="d-flex">
                                    <div class="flex-shrink-0">
                                        <img th:src="${svc.get('icon') != null ? svc.get('icon') : '/img/service_icon.jpg'}" src="/img/service_icon.jpg" alt="">
                                    </div>
                                    <div class="flex-grow-1 ms-3">
                                        <h4 class="h5" style="font-size: 0.9rem; color:#000;" th:text="${svc.get('name_en')}">English Name</h4>
                                        <p class="mb-0 w-xl-95" style="letter-spacing:2px;color:#666666;font-size: 1.0rem;" th:text="${svc.get('name')}">中文名稱</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-6 order-1 order-lg-2 ps-lg-1-9 ps-xl-0 mt-2-6">
                        <div class="row g-3">
                            <div class="col-12 mt-0">
                                <div class="text-end">
                                    <img class="border-radius-5" src="/img/service-01.jpg" alt="古雅軒法律事務所">
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="text-end">
                                    <img class="border-radius-5" src="/img/service-03.jpg" alt="古雅軒法律事務所">
                                </div>
                            </div>
                            <div class="col-6">
                                <div class="text-end">
                                    <img class="border-radius-5" src="/img/service-02.jpg" alt="古雅軒法律事務所">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>

    <!-- SCROLL TO TOP
    ================================================== -->
    <a href="#!" class="scroll-to-top"><i class="fas fa-angle-up" aria-hidden="true"></i></a>

    <!-- all js include start -->

    <!-- jQuery -->
    <script src="/js/jquery.min.js"></script>

    <!-- popper js -->
    <script src="/js/popper.min.js"></script>

    <!-- bootstrap -->
    <script src="/js/bootstrap.min.js"></script>

    <!-- search -->
    <script src="/search/search.js"></script>

    <!-- navigation -->
    <script src="/js/nav-menu.js"></script>

    <!-- tab -->
    <script src="/js/easy.responsive.tabs.js"></script>

    <!-- owl carousel -->
    <script src="/js/owl.carousel.js"></script>

    <!-- owl carousel thumb -->
    <script src="/js/owl.carousel.thumbs.js"></script>

    <!-- jquery.counterup.min -->
    <script src="/js/jquery.counterup.min.js"></script>

    <!-- stellar js -->
    <script src="/js/jquery.stellar.min.js"></script>

    <!-- waypoints js -->
    <script src="/js/waypoints.min.js"></script>

    <!-- countdown js -->
    <script src="/js/countdown.js"></script>

    <!-- jquery.magnific-popup js -->
    <script src="/js/jquery.magnific-popup.min.js"></script>

    <!-- lightgallery js -->
    <script src="/js/lightgallery-all.js"></script>

    <!-- mousewheel js -->
    <script src="/js/jquery.mousewheel.min.js"></script>

    <!--  clipboard js -->
    <script src="/js/clipboard.min.js"></script>

    <!--  prism js -->
    <script src="/js/prism.js"></script>

    <!-- custom scripts -->
    <script src="/js/main.js"></script>

    <!-- form plugins js -->
    <script src="/quform/js/plugins.js"></script>

    <!-- form scripts js -->
    <script src="/quform/js/scripts.js"></script>
</body>
</html>
