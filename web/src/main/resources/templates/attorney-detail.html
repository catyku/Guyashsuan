<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('GUYAHSUAN Law Office | 律師詳情')}"></head>
<body>

    <!-- PAGE LOADING
    ================================================== -->
    <div id="preloader"></div>

    <!-- MAIN WRAPPER
    ================================================== -->
    <div class="main-wrapper">

        <!-- HEADER
        ================================================== -->
        <header th:replace="~{fragments/layout :: headerInner}"></header>

        <!-- PAGE TITLE
        ================================================== -->
        <section class="top-position1 pt-0" style="background: #e3e4e5;padding-bottom: 70px;">
            <div class="page-title-section bg-img cover-background secondary-overlay" data-overlay-dark="8" data-background="/img/bg/bg-04.jpg">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="page-title">
                                <h1>Guyahsuan  Law Office</h1>
                                <p class="text-white fs-4 mb-0 letter-spacing-2" style="letter-spacing:7px;">/黃煦詮律師　鄭文朋律師 　陳庭浩律師</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COUNTER
            ================================================== -->
            <section class="bg-img cover-background secondary-overlay" data-overlay-dark="8" data-background="/img/attorney_bg.jpg">
                <div class="container">
                    <div class="row mt-n1-9">
                        <div class="col-sm-6 col-lg-3 mt-1-9">
                        </div>
                    </div>
                </div>
            </section>

            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="breadcrumb">
                            <ul>
                                <li><a th:href="@{/}">Home</a></li>
                                <li><a th:href="@{/attorney}">Attorneys, etc.</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- ATTORNEY DETAIL
        ================================================== -->
        <section class="pt-0" style="background: #e3e4e5;padding-bottom: 200px;">
            <div class="container">
                <div class="section-heading" style="padding-bottom: 50px;">
                    <span class="alt-font" style="letter-spacing:10px;" th:text="${attorney.get('title')}">職稱</span>
                    <h2 style="font-size: 1.8rem;" th:text="${attorney.get('name')}">律師姓名</h2>
                </div>

                <!-- TEAM
                ================================================== -->
                <section style="padding: 0px">
                    <div class="container">

                        <div class="row g-0 justify-content-center">
                            <div class="col-lg-4 order-2 order-lg-1">
                                <div class="testimonial-boxs">

                                    <div class="testimonial-style2 owl-carousel owl-theme">
                                        <div class="testimonial-block" th:if="${attorney.get('education') != null and attorney.get('education') != ''}">
                                            <div class="flex-grow-1 ms-3">
                                                <h3 class="h5 mb-1">學　歷</h3>
                                                <span class="display-30 text-muted">Education</span>
                                            </div>
                                            <p class="mb-3 mb-md-4 display-29 display-sm-28" style="padding-top: 10px;font-size: 0.9rem;" th:utext="${attorney.get('education')}">學歷</p>
                                        </div>
                                        <div class="testimonial-block" th:if="${attorney.get('experience') != null and attorney.get('experience') != ''}">
                                            <div class="flex-grow-1 ms-3">
                                                <h3 class="h5 mb-1">經　歷</h3>
                                                <span class="display-30 text-muted">Experience</span>
                                            </div>
                                            <p class="mb-3 mb-md-4 display-29 display-sm-28" style="padding-top: 10px;font-size: 0.9rem;" th:utext="${attorney.get('experience')}">經歷</p>
                                        </div>
                                        <div class="testimonial-block" th:if="${attorney.get('specialty') != null and attorney.get('specialty') != ''}">
                                            <div class="flex-grow-1 ms-3">
                                                <h3 class="h5 mb-1">專　長</h3>
                                                <span class="display-30 text-muted">Specialty</span>
                                            </div>
                                            <p class="mb-3 mb-md-4 display-29 display-sm-28" style="padding-top: 10px;font-size: 0.9rem;" th:text="${attorney.get('specialty')}">專長</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-lg-6 order-1 order-lg-2" th:if="${attorney.get('photo') != null and attorney.get('photo') != ''}">
                                <img th:src="${attorney.get('photo')}" th:alt="${attorney.get('name')}">
                            </div>
                        </div>

                    </div>
                </section>

                <!-- DESCRIPTION
                ================================================== -->
                <div class="container mt-4" th:if="${attorney.get('description') != null and attorney.get('description') != ''}">
                    <div class="row justify-content-center">
                        <div class="col-lg-10">
                            <p style="font-size: 0.95rem; line-height: 2;" th:text="${attorney.get('description')}">簡介</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- OTHER ATTORNEYS
        ================================================== -->
        <section class="pt-0" style="background: #e3e4e5;padding-bottom: 100px;">
            <div class="container">
                <div class="section-heading" style="padding-bottom: 50px;">
                    <span class="alt-font" style="letter-spacing:10px;">其他律師</span>
                    <h2>Other Attorneys</h2>
                </div>

                <section style="padding: 0px">
                    <div class="container">
                        <div class="row mt-n1-9">
                            <div class="col-sm-6 col-lg-4 mt-1-9" th:each="item : ${attorneys}">
                                <a th:href="@{/attorney/{id}(id=${item['id']})}" class="text-decoration-none">
                                    <div class="card card-style6 border-radius-5 border-0" style="background-color:#e2e3e4">
                                        <div class="team-img position-relative overflow-hidden border-radius-5" th:if="${item['photo'] != null and item['photo'] != ''}">
                                            <img th:src="${item['photo']}" th:alt="${item['name']}">
                                        </div>
                                        <div class="card-body">
                                            <h4 th:text="${item['name']}">律師姓名</h4>
                                            <span class="text-primary" th:text="${item['title']}">職稱</span>
                                        </div>
                                    </div>
                                </a>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </section>

        <!-- FOOTER
        ================================================== -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>

    </div>

    <!-- SCROLL TO TOP
    ================================================== -->
    <a href="#!" class="scroll-to-top"><i class="fas fa-angle-up" aria-hidden="true"></i></a>

    <!-- all js include start -->

    <!-- jQuery -->
    <script src="/js/jquery.min.js"></script>

    <!-- popper js -->
    <script src="/js/popper.min.js"></script>

    <!-- bootstrap -->
    <script src="/js/bootstrap.min.js"></script>

    <!-- search -->
    <script src="/search/search.js"></script>

    <!-- navigation -->
    <script src="/js/nav-menu.js"></script>

    <!-- tab -->
    <script src="/js/easy.responsive.tabs.js"></script>

    <!-- owl carousel -->
    <script src="/js/owl.carousel.js"></script>

    <!-- owl carousel thumb -->
    <script src="/js/owl.carousel.thumbs.js"></script>

    <!-- jquery.counterup.min -->
    <script src="/js/jquery.counterup.min.js"></script>

    <!-- stellar js -->
    <script src="/js/jquery.ststellar.min.js"></script>

    <!-- waypoints js -->
    <script src="/js/waypoints.min.js"></script>

    <!-- countdown js -->
    <script src="/js/countdown.js"></script>

    <!-- jquery.magnific-popup js -->
    <script src="/js/jquery.magnific-popup.min.js"></script>

    <!-- lightgallery js -->
    <script src="/js/lightgallery-all.js"></script>

    <!-- mousewheel js -->
    <script src="/js/jquery.mousewheel.min.js"></script>

    <!--  clipboard js -->
    <script src="/js/clipboard.min.js"></script>

    <!--  prism js -->
    <script src="/js/prism.js"></script>

    <!-- custom scripts -->
    <script src="/js/main.js"></script>

    <!-- form plugins js -->
    <script src="/quform/js/plugins.js"></script>

    <!-- form scripts js -->
    <script src="/quform/js/scripts.js"></script>

</body>
</html>
