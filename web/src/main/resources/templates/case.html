<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('GUYAHSUAN Law Office | 案件實績')}"></head>
<body>

    <!-- PAGE LOADING
    ================================================== -->
    <div id="preloader"></div>

    <!-- MAIN WRAPPER
    ================================================== -->
    <div class="main-wrapper">

        <!-- HEADER
        ================================================== -->
        <header th:replace="~{fragments/layout :: headerInner}"></header>

        <!-- PAGE TITLE
        ================================================== -->
        <section class="top-position1 pt-0" style="background: #e3e4e5;padding-bottom: 70px;">
            <div class="page-title-section bg-img cover-background secondary-overlay" data-overlay-dark="8" data-background="/img/bg/bg-04.jpg">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="page-title">
                                <h1>Guyahsuan  Law Office</h1>
                                <p class="text-white fs-4 mb-0 letter-spacing-2" style="letter-spacing:7px;">/黃煦詮律師　鄭文朋律師 　陳庭浩律師</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- COUNTER
            ================================================== -->
            <section class="bg-img cover-background secondary-overlay" data-overlay-dark="8" data-background="/img/case_bg.jpg">
                <div class="container">
                    <div class="row mt-n1-9">
                        <div class="col-sm-6 col-lg-3 mt-1-9">
                        </div>
                    </div>
                </div>
            </section>

            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="breadcrumb">
                            <ul>
                                <li><a th:href="@{/}">Home</a></li>
                                <li><a th:href="@{/case.html}">Sucessful Case</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- CASE LIST
        ================================================== -->
        <section class="pt-0" style="background: #e3e4e5;padding-bottom: 100px;">
            <div class="container">
                <div class="section-heading" style="padding-bottom: 50px;">
                    <span class="alt-font" style="letter-spacing:10px;">案件實績</span>
                    <h2>Sucessful Case</h2>
                </div>
                <div class="row mt-n1-9">
                    <div class="col-md-6 col-lg-4 mt-1-9" th:each="item : ${cases}">
                        <article class="card card-style3 position-relative border-0 rounded-0 bg-transparent h-100">
                            <div class="card-img">
                                <img th:src="${item.get('image') != null ? item.get('image') : '/img/case1.jpg'}" th:alt="${item.get('title')}">
                                <div class="tags">
                                    <a style="letter-spacing:10px;" th:text="${item.get('category')}">類別</a>
                                </div>
                            </div>
                            <div class="card-body">
                                <ul class="list-unstyled mb-3">
                                    <li class="d-inline-block me-3"><i class="far fa-calendar-check me-1 text-primary"></i> <span th:text="${item.get('case_date')}">日期</span></li>
                                </ul>
                                <h3 class="mb-3 h4"><a th:href="@{/case/{id}.html(id=${item.get('id')})}" th:text="${item.get('title')}">標題</a></h3>
                                <p th:text="${item.get('summary') != null ? item.get('summary') : ''}">描述</p>
                                <a th:href="@{/case/{id}.html(id=${item.get('id')})}" class="font-weight-500">Read more<i class="fas fa-long-arrow-alt-right align-middle ms-2 display-30"></i></a>
                            </div>
                        </article>
                    </div>
                </div>
            </div>
        </section>

        <!-- FOOTER
        ================================================== -->
        <footer th:replace="~{fragments/layout :: footer}"></footer>

    </div>

    <!-- SCROLL TO TOP
    ================================================== -->
    <a href="#!" class="scroll-to-top"><i class="fas fa-angle-up" aria-hidden="true"></i></a>

    <!-- all js include start -->

    <!-- jQuery -->
    <script src="/js/jquery.min.js"></script>

    <!-- popper js -->
    <script src="/js/popper.min.js"></script>

    <!-- bootstrap -->
    <script src="/js/bootstrap.min.js"></script>

    <!-- search -->
    <script src="/search/search.js"></script>

    <!-- navigation -->
    <script src="/js/nav-menu.js"></script>

    <!-- tab -->
    <script src="/js/easy.responsive.tabs.js"></script>

    <!-- owl carousel -->
    <script src="/js/owl.carousel.js"></script>

    <!-- owl carousel thumb -->
    <script src="/js/owl.carousel.thumbs.js"></script>

    <!-- jquery.counterup.min -->
    <script src="/js/jquery.counterup.min.js"></script>

    <!-- stellar js -->
    <script src="/js/jquery.stellar.min.js"></script>

    <!-- waypoints js -->
    <script src="/js/waypoints.min.js"></script>

    <!-- countdown js -->
    <script src="/js/countdown.js"></script>

    <!-- jquery.magnific-popup js -->
    <script src="/js/jquery.magnific-popup.min.js"></script>

    <!-- lightgallery js -->
    <script src="/js/lightgallery-all.js"></script>

    <!-- mousewheel js -->
    <script src="/js/jquery.mousewheel.min.js"></script>

    <!--  clipboard js -->
    <script src="/js/clipboard.min.js"></script>

    <!--  prism js -->
    <script src="/js/prism.js"></script>

    <!-- custom scripts -->
    <script src="/js/main.js"></script>

    <!-- form plugins js -->
    <script src="/quform/js/plugins.js"></script>

    <!-- form scripts js -->
    <script src="/quform/js/scripts.js"></script>

</body>

</html>
