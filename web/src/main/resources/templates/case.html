<!DOCTYPE html>
<html lang="zh-TW" 
      xmlns:th="http://www.thymeleaf.org" 
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" 
      layout:decorate="~{fragments/layout}">

<head>
    <title>GUYAHSUAN Law Office | 古雅軒法律事務所 | Sucessful Cas 案件實績</title>
</head>

<body>

<th:block layout:fragment="content">

<!-- PAGE TITLE
        ================================================== -->
        <section class="top-position1 pt-0" style="background: #e3e4e5;padding-bottom: 70px;">
            <div class="page-title-section bg-img cover-background secondary-overlay" data-overlay-dark="8" data-background="/img/bg/bg-04.jpg">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-12">
                            <div class="page-title">
                                <h1>Guyahsuan  Law Office</h1>
                                <p class="text-white fs-4 mb-0 letter-spacing-2" style="letter-spacing:7px;">/黃煦詮律師　鄭文朋律師 　陳庭浩律師</p>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
			        <!-- COUNTER
        ================================================== -->
        <section class="bg-img cover-background secondary-overlay" data-overlay-dark="8" data-background="/img/case_bg.jpg">
            <div class="container">
                <div class="row mt-n1-9">
                    <div class="col-sm-6 col-lg-3 mt-1-9">
                           
                    </div>
                    
                    
                    
                </div>
            </div>
        </section>
            <div class="container">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="breadcrumb">
                            <ul>
                                <li><a href="/index.html">Home</a></li>
                                <li><a href="/case.html">Sucessful Case</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- CASE LIST
        ================================================== -->
        <section class="pt-0" style="background: #e3e4e5;padding-bottom: 100px;">
            <div class="container">
                <div class="section-heading" style="padding-bottom: 50px;">
                    <span class="alt-font" style="letter-spacing:10px;">案件實績</span>
                    <h2>Sucessful Case</h2>
                </div>

                <!-- 無資料提示 -->
                <div th:if="${#lists.isEmpty(cases)}" class="text-center py-5">
                    <p class="text-muted">目前尚無案件實績資料。</p>
                </div>

                <div class="row mt-n1-9" th:unless="${#lists.isEmpty(cases)}">
                    <div class="col-md-6 col-lg-4 mt-1-9" th:each="case : ${cases}">
                        <article class="card card-style3 position-relative border-0 rounded-0 bg-transparent h-100">
                            <div class="card-img">
                                <img th:if="${case.image != null and !#strings.isEmpty(case.image)}"
                                      th:src="@{${case.image}}"
                                     th:alt="${case.title}" />
                                <img th:unless="${case.image != null and !#strings.isEmpty(case.image)}"
                                     th:src="@{/img/content/case-default.jpg}"
                                     src="/img/content/case-default.jpg"
                                     th:alt="${case.title}" />
                                <div class="tags" th:if="${case.category != null}">
                                    <a th:text="${case.category}" style="letter-spacing:5px;"></a>
                                </div>
                            </div>
                            <div class="card-body">
                                <ul class="list-unstyled mb-3">
                                    <li class="d-inline-block me-3">
                                        <i class="far fa-calendar-check me-1 text-primary"></i>
                                        <span th:text="${case.case_date}"></span>
                                    </li>
                                </ul>
                                <h3 class="mb-3 h4">
                                    <a th:href="@{/case/{id}.html(id=${case.id})}" th:text="${case.title}"></a>
                                </h3>
                                <p th:text="${case.summary}"></p>
                                <a th:href="@{/case/{id}.html(id=${case.id})}" class="font-weight-500">
                                    Read more<i class="fas fa-long-arrow-alt-right align-middle ms-2 display-30"></i>
                                </a>
                            </div>
                        </article>
                    </div>
                </div>

                <!-- 分頁 -->
                <div class="row" th:if="${totalPages > 1}">
                    <div class="col-sm-12">
                        <div class="text-center mt-6 mt-lg-7">
                            <div class="pagination">
                                <ul>
                                    <!-- 上一頁 -->
                                    <li th:if="${currentPage > 1}">
                                        <a th:href="@{/case.html(page=${currentPage - 1})}" class="me-3">
                                            <i class="fas fa-long-arrow-alt-left"></i>
                                        </a>
                                    </li>
                                    <li th:unless="${currentPage > 1}">
                                        <a href="#!" class="me-3 disabled" style="opacity: 0.5; cursor: not-allowed;">
                                            <i class="fas fa-long-arrow-alt-left"></i>
                                        </a>
                                    </li>

                                    <!-- 頁碼 -->
                                    <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
                                        <li th:if="${i <= 3 or i > totalPages - 3 or (i >= currentPage - 1 and i <= currentPage + 1)}" 
                                            th:classappend="${i == currentPage} ? 'active' : ''">
                                            <a th:href="@{/case.html(page=${i})}" 
                                               th:text="${i}" 
                                               class="me-2">1</a>
                                        </li>
                                        <li th:if="${(i == 4 and currentPage > 5) or (i == totalPages - 3 and currentPage < totalPages - 4)}" 
                                            class="me-2">
                                            <span>...</span>
                                        </li>
                                    </th:block>

                                    <!-- 下一頁 -->
                                    <li th:if="${currentPage < totalPages}">
                                        <a th:href="@{/case.html(page=${currentPage + 1})}">
                                            <i class="fas fa-long-arrow-alt-right"></i>
                                        </a>
                                    </li>
                                    <li th:unless="${currentPage < totalPages}">
                                        <a href="#!" class="disabled" style="opacity: 0.5; cursor: not-allowed;">
                                            <i class="fas fa-long-arrow-alt-right"></i>
                                        </a>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </section>

 





         <!-- FOOTER
        ================================================== -->

</th:block>

</body>

</html>
