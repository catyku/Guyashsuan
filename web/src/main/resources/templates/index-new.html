                    <p class="w-lg-80 text-white mx-auto lead font-weight-500 mb-2-2" style="letter-spacing:5px;color: #fff;">鉅細靡遺蒐羅全臺各法院裁判，輔以學說見解發展，以與社會脈動相結合的法律詮釋，
