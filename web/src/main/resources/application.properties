spring.application.name=law-admin
spring.config.import=optional:file:.env[.properties]
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==================== 伺服器設定 ====================
server.port=${SERVER_PORT:8092}
server.servlet.context-path=${CONTEXT_PATH:}

# ==================== 資料庫設定 ====================
spring.datasource.url=jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:guyahsuan}?useUnicode=true&characterEncoding=utf8&serverTimezone=${DB_TIMEZONE:Asia/Taipei}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}

# ==================== Session 設定 ====================
server.servlet.session.timeout=${SESSION_TIMEOUT:3600s}
spring.session.max-sessions=${SESSION_MAX_SESSIONS:1}

# ==================== 檔案上傳設定 ====================
app.upload.root-path=${UPLOAD_ROOT_PATH:../uploads-law}
app.upload.attorney-path=${app.upload.root-path}/attorney
app.upload.case-path=${app.upload.root-path}/case
app.upload.share-path=${app.upload.root-path}/share
app.upload.banner-path=${app.upload.root-path}/banner
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:30MB}
app.upload.img-width=${UPLOAD_IMG_WIDTH:1024}
app.upload.img-height=${UPLOAD_IMG_HEIGHT:768}
app.upload.thumbnail-threshold=${UPLOAD_THUMBNAIL_THRESHOLD:5242880}

# ==================== 靜態資源對外路徑 ====================
spring.web.resources.static-locations=classpath:/static/,file:${app.upload.root-path}/
spring.mvc.static-path-pattern=/**

# ==================== Thymeleaf 設定 ====================
# cache 設定已移至 application-dev.properties / application-prod.properties
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# ==================== 日誌設定 ====================
logging.config=classpath:logback-spring.xml