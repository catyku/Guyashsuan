<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${item.get('title') + ' - 古雅軒法律事務所'})}"></head>
<body>
    <div id="preloader"></div>
    <div class="main-wrapper">
        <header th:replace="~{fragments/layout :: header}"></header>

        <section class="py-6 py-md-16 py-lg-20 py-xxl-22 bg-img cover-background secondary-overlay" data-overlay-dark="75" data-background="/img/share_bg.jpg">
            <div class="container pt-1-9 pt-sm-6 pt-md-0 mt-n1-9">
                <div class="row align-items-center position-relative z-index-1 justify-content-center">
                    <div class="col-md-10 col-lg-9 col-xl-8 col-xxl-7 text-center py-5">
                        <span class="alt-font" style="letter-spacing:10px;">情報分享</span>
                        <h1 class="text-white" style="letter-spacing:5px;" th:text="${item.get('title')}">文章標題</h1>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="container">
                <div class="row">
                    <div class="col-lg-8">
                        <p class="text-muted mb-4"><i class="far fa-calendar-check me-1"></i> <span th:text="${item.get('share_date')}">日期</span></p>
                        <div th:if="${item.get('image') != null}" class="mb-4">
                            <img th:src="${item.get('image')}" th:alt="${item.get('title')}" style="width:100%;border-radius:5px;">
                        </div>
                        <div th:utext="${item.get('content') != null ? item.get('content') : ''}">
                            文章內容
                        </div>
                    </div>
                    <div class="col-lg-4">
                        <div class="bg-light p-4 rounded">
                            <h5 class="mb-3">其他文章</h5>
                            <div th:each="s : ${shares}" class="mb-2">
                                <a th:href="@{/share/{id}(id=${s.get('id')})}" class="d-block mb-1" th:text="${s.get('title')}">文章標題</a>
                                <small class="text-muted" th:text="${s.get('share_date')}">日期</small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
    <script src="/js/jquery.min.js"></script>
    <script src="/js/popper.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
