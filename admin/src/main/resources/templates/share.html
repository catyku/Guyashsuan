<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('GUYAHSUAN Law Office | 情報分享')}"></head>
<body>
    <div id="preloader"></div>
    <div class="main-wrapper">
        <header th:replace="~{fragments/layout :: header}"></header>

        <section class="py-6 py-md-16 py-lg-20 py-xxl-22 bg-img cover-background secondary-overlay" data-overlay-dark="75" data-background="/img/share_bg.jpg">
            <div class="container pt-1-9 pt-sm-6 pt-md-0 mt-n1-9">
                <div class="row align-items-center position-relative z-index-1 justify-content-center">
                    <div class="col-md-10 col-lg-9 col-xl-8 col-xxl-7 text-center py-5">
                        <span class="alt-font" style="letter-spacing:10px;">情報分享</span>
                        <h1 class="text-white" style="letter-spacing:5px;">Intelligence Sharing</h1>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <div class="container">
                <div class="section-heading">
                    <span class="alt-font" style="letter-spacing:10px;">情報分享</span>
                    <h2>Intelligence Sharing</h2>
                </div>
                <div class="row mt-n1-9">
                    <div class="col-md-6 col-lg-4 mt-1-9" th:each="item : ${shares}">
                        <div class="card card-style1">
                            <div class="card-img" th:if="${item.get('image') != null and item.get('image') != ''}">
                                <a th:href="@{/share/{id}(id=${item.get('id')})}">
                                    <img th:src="${item.get('image')}" th:alt="${item.get('title')}">
                                </a>
                            </div>
                            <div class="card-body">
                                <p class="mb-3 w-95 mx-auto" th:text="${item.get('share_date')}">日期</p>
                                <h3 class="mb-3 h4"><a th:href="@{/share/{id}(id=${item.get('id')})}" th:text="${item.get('title')}">標題</a></h3>
                                <p th:text="${item.get('summary') != null ? item.get('summary') : ''}">內容摘要</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <footer th:replace="~{fragments/layout :: footer}"></footer>
    </div>
    <script src="/js/jquery.min.js"></script>
    <script src="/js/popper.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
